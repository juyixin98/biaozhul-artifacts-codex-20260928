[project]
name = "mcmc-diagnostics-service"
version = "1.0.0"
description = "Local FastAPI service for autocorrelation, ESS, and MCMC convergence diagnostics"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "numpy==2.5.3",
  "scipy==1.18.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
