[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beta-binomial-backend"
version = "0.1.0"
description = "Batch Beta-Binomial updating and prediction backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "pydantic>=2",
  "numpy",
  "scipy",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
