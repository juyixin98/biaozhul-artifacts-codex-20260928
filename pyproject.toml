[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-trust-region-nls"
version = "0.1.0"
description = "Bounded nonlinear least-squares service using a scaled trust-region method."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "numpy>=1.26",
  "pydantic>=2.5",
  "scipy>=1.11",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["httpx>=0.26", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]
log_cli = false
log_level = "INFO"

[tool.setuptools.packages.find]
include = ["app*"]
