[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lasso-path-backend"
version = "0.1.0"
description = "Coordinate-descent Lasso regularization path backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.26",
    "pydantic>=2.5",
    "scipy>=1.11",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8",
    "scikit-learn>=1.4",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
