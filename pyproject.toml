[project]
name = "synthetic-survey-imputation-backend"
version = "0.1.0"
description = "FastAPI backend for synthetic survey complete-case, mean imputation, and multiple imputation comparison"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "numpy==2.5.3",
  "scipy==1.18.1",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pandas==2.3.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
