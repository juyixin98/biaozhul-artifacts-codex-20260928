[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "two-phase-simplex-service"
version = "0.1.0"
description = "Small linear programming service with a NumPy two-phase simplex core"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.3",
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "scipy==1.18.1",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
