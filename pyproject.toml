[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entropic-ot-service"
version = "0.1.0"
description = "Finite discrete entropically regularized optimal transport"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<0.142",
  "numpy>=2.5,<2.6",
  "pydantic>=2.13,<2.14",
  "scipy>=1.18,<1.19",
  "uvicorn>=0.54,<0.55",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<0.29",
  "pytest>=9.1,<9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
