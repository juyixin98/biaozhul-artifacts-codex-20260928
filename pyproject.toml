[project]
name = "probability-calibration-lab"
version = "1.0.0"
description = "Weighted probability calibration analysis with fixed and equal-frequency bins."
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "numpy",
  "pydantic",
  "scipy",
  "uvicorn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s %(levelname)s run_context=%(name)s %(message)s"
log_file_date_format = "%Y-%m-%dT%H:%M:%S%z"
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(message)s"
log_cli_date_format = "%H:%M:%S"

