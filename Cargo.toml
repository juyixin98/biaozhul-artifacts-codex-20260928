[package]
name = "maxflow-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.7.9"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
tokio = { version = "=1.45.1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }

[profile.release]
debug = true
