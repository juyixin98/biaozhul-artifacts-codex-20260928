[package]
name = "msf-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.7.9"
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
tokio = { version = "=1.42.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "=0.8.23"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }

[[bin]]
name = "msf-service"
path = "src/main.rs"

[profile.release]
lto = "thin"
