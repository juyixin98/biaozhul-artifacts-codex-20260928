[package]
name = "ktruss-backend"
version = "0.1.0"
edition = "2021"
description = "Undirected simple graph triangle support and k-truss decomposition backend"

[dependencies]
axum = { version = "0.7.9", features = ["macros"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "1.0.64"
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower = { version = "0.5.1", features = ["util"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uuid = { version = "1.10.0", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5.1", features = ["util"] }

[lints.rust]
missing_debug_implementations = "warn"
