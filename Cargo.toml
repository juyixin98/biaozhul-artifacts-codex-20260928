[package]
name = "chordal-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5.2", features = ["util"] }
